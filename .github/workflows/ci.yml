name: HAVENHUB Backend CI Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  verify:
    name: Type Check & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check (Strict TypeScript Verification)
        run: npm run type-check

      - name: Run Unit Tests (Jest)
        run: npm test

      - name: Run NestJS Production Build
        run: npm run build
